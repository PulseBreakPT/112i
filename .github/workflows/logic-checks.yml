name: Validar lógica do Distrito 112

on:
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/**"
      - ".github/workflows/logic-checks.yml"
  pull_request:
    paths:
      - "frontend/src/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "backend/**"
      - ".github/workflows/logic-checks.yml"

jobs:
  frontend-logic:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm install --no-save --legacy-peer-deps ajv@8 ajv-keywords@5
      - name: Testes da engine
        run: npm test -- --watchAll=false --runInBand
      - name: Build de produção
        run: npm run build
        env:
          CI: "true"

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar sintaxe Python
        run: python -m compileall -q backend
      - name: Instalar dependências mínimas de teste
        run: python -m pip install --disable-pip-version-check pytest pytest-xdist httpx fastapi pydantic
      - name: Testes unitários do backend
        run: pytest -q backend/tests
